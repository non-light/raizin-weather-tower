<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAIZIN WEATHER TOWER</title>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <div id="score">SCORE: 0000</div>
    <div id="status">
      <div class="chip" id="weather-badge">天候：☀️ 晴れ</div>
      <div class="chip" id="color-badge">指定色：—</div>
    </div>

    <div id="title-tag">RAIZIN WEATHER TOWER <span>prototype</span></div>
    <div id="hint">ドラッグ＝カメラ回転 / ホイール＝ズーム / 右クリック・Esc＝もどす</div>

    <div id="weather-flash">
      <div id="weather-flash-main"></div>
      <div id="weather-flash-sub"></div>
    </div>

    <div id="prompt"></div>

    <div id="mascot">
      <div id="bubble"><span id="bubble-text"></span></div>
      <div id="mascot-art">
        <img id="raizin-img" alt="RAIZIN" />
        <div id="raizin-fallback">RAIZIN</div>
      </div>
    </div>

    <div id="roulette">
      <div class="rl-panel">
        <div id="rl-title">COLOR ROULETTE</div>
        <div id="rl-wheel">
          <div id="rl-pointer"></div>
          <canvas id="rl-canvas" width="320" height="320"></canvas>
          <button id="rl-spin">SPIN</button>
        </div>
        <div id="rl-result"></div>
      </div>
    </div>

    <div id="gameover">
      <div class="go-inner">
        <h1>GAME OVER</h1>
        <p id="final-score">SCORE: 0000</p>
        <button id="retry">もう一度遊ぶ</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
